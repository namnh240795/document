# ============================================================
# Module Registry - BA Documentation Framework
# Define all modules, their databases, tables, and dependencies
# ============================================================

project:
  name: "Authentication System"
  short_name: "auth"

# ============================================================
# Modules
# ============================================================
modules:
  - code: AUTH
    name: "Authentication"
    description: "User accounts, login, roles, sessions, verification"
    database: auth_db
    tables:
      - auth_users
      - auth_sessions
      - auth_accounts
      - auth_verification
      - auth_roles
      - auth_user_roles
      - auth_organizations
      - auth_members
      - auth_teams
      - auth_team_members
      - auth_invitations
      - auth_organization_roles
    depends_on:
      - SMS
      - EMAIL
      - LOG
    tech_stack:
      - NestJS
      - Better Auth
      - Drizzle ORM
      - PostgreSQL

  - code: SMS
    name: "SMS Service"
    description: "SMS delivery logging, tracking, and audit trail"
    database: sms_db
    tables:
      - sms_logs
    depends_on:
      - AUTH
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - Twilio

  - code: EMAIL
    name: "Email Notification"
    description: "Email notification delivery, templating, and audit trail"
    database: email_db
    tables:
      - email_logs
    depends_on: []
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - RabbitMQ
      - SendGrid/SMTP

  - code: RECR
    name: "Recruitment"
    description: "End-to-end recruitment management with 3 roles: Candidate, HR, Employer"
    database: recr_db
    tables:
      - recr_users
      - recr_candidates
      - recr_employers
      - recr_hr_profiles
      - recr_jobs
      - recr_applications
      - recr_interviews
      - recr_evaluations
      - recr_offers
      - recr_job_requirements
    depends_on:
      - AUTH
      - LOG
    color: "#E8F4E8"
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - Elasticsearch
      - RabbitMQ

  - code: WALLET
    name: "Electronic Wallet"
    description: "Electronic wallet for payments, deposits, withdrawals, and financial transactions within the recruitment platform"
    database: wallet_db
    tables:
      - wallet_wallets
      - wallet_transactions
      - wallet_payment_methods
      - wallet_payment_orders
      - wallet_payout_requests
    depends_on:
      - AUTH
      - LOG
    color: "#E8F4FD"
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - RabbitMQ

  - code: LOG
    name: "Logger"
    description: "Centralized event logging — receives log events from all services via RabbitMQ, stores in OpenSearch for full-text search, analytics, and dashboards"
    database: opensearch
    index: log-events
    tables: []
    depends_on:
      - AUTH
    tech_stack:
      - NestJS
      - RabbitMQ (amqplib)
      - OpenSearch (@opensearch-project/opensearch)
    architecture:
      description: |
        Event-driven logging pipeline (OpenSearch as primary store):
        Any Service → RabbitMQ (queue: log.events) → Logger Consumer → OpenSearch
      components:
        - name: Log Producer
          role: "Publishes log events to RabbitMQ queue 'log.events'"
          implemented_in: "Each service (AUTH, SMS, etc.)"
        - name: Log Consumer
          role: "Consumes from RabbitMQ, indexes to OpenSearch"
          implemented_in: "Logger Worker"
        - name: OpenSearch
          role: "Primary store — full-text search, analytics, dashboards"
          index: "log-events"
        - name: Log Query API
          role: "REST API to query logs from OpenSearch"
      log_schema:
        eventId: "keyword — unique event identifier (UUID)"
        source: "text + keyword — producing service name (auth, sms, etc.)"
        level: "keyword — debug, info, warn, error"
        action: "keyword — event action (login, register, send_otp, etc.)"
        message: "text — human-readable log message"
        input: "text — input data as JSON string"
        output: "text — success output as JSON string"
        error: "text — error message on failure"
        exception: "text — exception with stack trace"
        metadata: "object — additional context data"
        traceId: "keyword — distributed trace ID"
        userId: "keyword — associated user ID"
        timestamp: "date — event timestamp (ISO 8601)"

# ============================================================
# Features — maps business features to modules
# Shows which modules work together for each feature
# ============================================================
features:
  - name: "User Registration"
    modules: [AUTH, SMS, EMAIL, LOG]
    description: "User signs up, receives OTP via SMS/email, account created, event logged"

  - name: "User Login"
    modules: [AUTH, LOG]
    description: "User authenticates, session created, login event logged"

  - name: "Phone Verification"
    modules: [AUTH, SMS, LOG]
    description: "User requests SMS OTP, SMS delivered, verification confirmed, event logged"

  - name: "Email Verification"
    modules: [AUTH, EMAIL, LOG]
    description: "User requests email OTP, email delivered, verification confirmed, event logged"

  - name: "Password Reset"
    modules: [AUTH, EMAIL, LOG]
    description: "User requests reset, email sent with token, password updated, event logged"

  - name: "Job Posting"
    modules: [RECR, LOG]
    description: "HR Manager creates job listing, job published, event logged"

  - name: "Application Submission"
    modules: [RECR, EMAIL, LOG]
    description: "Candidate submits application, confirmation email sent, event logged"

  - name: "Interview Scheduling"
    modules: [RECR, EMAIL, LOG]
    description: "Recruiter schedules interview, calendar invite sent, event logged"

  - name: "Offer Management"
    modules: [RECR, EMAIL, LOG]
    description: "Recruiter creates offer, offer letter sent, event logged"

  - name: "Wallet Deposit"
    modules: [WALLET, LOG]
    description: "User deposits funds via bank transfer, credit card, or e-wallet, transaction recorded"

  - name: "Wallet Withdrawal"
    modules: [WALLET, LOG]
    description: "User requests withdrawal, admin approves, funds transferred to bank"

  - name: "Wallet Transfer"
    modules: [WALLET, LOG]
    description: "User transfers funds to another user's wallet"

  - name: "Job Posting Payment"
    modules: [WALLET, RECR, LOG]
    description: "Employer pays for job posting using wallet balance, job activated"

  - name: "Featured Job Payment"
    modules: [WALLET, RECR, LOG]
    description: "Employer pays to feature job listing, job marked as featured"

  - name: "Wallet Management"
    modules: [WALLET, LOG]
    description: "User views balance, sets PIN, manages payment methods, views transaction history"

# ============================================================
# Inter-Module Communication (Webhook Events)
# Modules communicate via webhook events
# ============================================================
webhooks:
  - from: AUTH
    to: SMS
    event: verification.requested
    protocol: RabbitMQ
    description: "AUTH publishes when user requests account verification"
    queue: verification.sms
    payload:
      user_id: uuid
      phone: string
      channel: "sms" | "email"
      otp: string
      verification_id: string

  - from: AUTH
    to: SMS
    event: verification.resent
    protocol: RabbitMQ
    description: "AUTH publishes when user resends verification (rate-limited)"
    queue: verification.sms
    payload:
      user_id: uuid
      phone: string
      channel: "sms" | "email"
      otp: string
      verification_id: string

  - from: SMS
    to: AUTH
    event: verification.delivered
    protocol: Webhook
    description: "SMS confirms delivery status back to AUTH"
    url: /api/webhooks/sms/delivered
    payload:
      verification_id: string
      status: "delivered" | "failed"
      provider_message_id: string
      error_message: string | null

  # ============================================================
  # Logger Module Events (all services -> LOG)
  # ============================================================

  - from: AUTH
    to: LOG
    event: auth.event.logged
    protocol: RabbitMQ
    description: "AUTH publishes any auth event (login, logout, register, password change) to Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      ip_address: string
      user_agent: string
      metadata: jsonb
      timestamp: iso8601

  - from: SMS
    to: LOG
    event: sms.event.logged
    protocol: RabbitMQ
    description: "SMS publishes delivery events (sent, delivered, failed) to Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      provider_message_id: string
      status: string
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Email Module Events (AUTH -> EMAIL)
  # ============================================================

  - from: AUTH
    to: EMAIL
    event: verification.email.requested
    protocol: RabbitMQ
    description: "AUTH publishes when user requests email verification"
    queue: verification.email
    payload:
      user_id: uuid
      email: string
      channel: "email"
      otp: string
      verification_id: string

  - from: AUTH
    to: EMAIL
    event: verification.email.resent
    protocol: RabbitMQ
    description: "AUTH publishes when user resends email verification (rate-limited)"
    queue: verification.email
    payload:
      user_id: uuid
      email: string
      channel: "email"
      otp: string
      verification_id: string

  - from: EMAIL
    to: AUTH
    event: verification.email.delivered
    protocol: Webhook
    description: "EMAIL confirms delivery status back to AUTH"
    url: /api/webhooks/email/delivered
    payload:
      verification_id: string
      status: "delivered" | "failed"
      provider_message_id: string
      error_message: string | null

  # ============================================================
  # Email Module Events (EMAIL -> LOG)
  # ============================================================

  - from: EMAIL
    to: LOG
    event: email.event.logged
    protocol: RabbitMQ
    description: "EMAIL publishes email delivery events (sent, delivered, failed) to Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      provider_message_id: string
      status: string
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Recruitment Module Events (RECR -> EMAIL, LOG)
  # ============================================================

  - from: RECR
    to: EMAIL
    event: application.submitted
    protocol: RabbitMQ
    description: "RECR publishes when candidate submits application"
    queue: recruitment.email
    payload:
      event_id: uuid
      candidate_email: string
      candidate_name: string
      job_title: string
      timestamp: iso8601

  - from: RECR
    to: EMAIL
    event: interview.scheduled
    protocol: RabbitMQ
    description: "RECR publishes when interview is scheduled"
    queue: recruitment.email
    payload:
      event_id: uuid
      candidate_email: string
      candidate_name: string
      interviewer_email: string
      scheduled_at: iso8601
      location: string
      meeting_link: string
      timestamp: iso8601

  - from: RECR
    to: EMAIL
    event: offer.sent
    protocol: RabbitMQ
    description: "RECR publishes when offer letter is sent"
    queue: recruitment.email
    payload:
      event_id: uuid
      candidate_email: string
      candidate_name: string
      position_title: string
      salary: decimal
      start_date: date
      timestamp: iso8601

  - from: RECR
    to: LOG
    event: recruitment.event.logged
    protocol: RabbitMQ
    description: "RECR publishes recruitment events (application, interview, offer) to Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Wallet Module Events (WALLET -> RECR, LOG)
  # ============================================================

  - from: WALLET
    to: RECR
    event: wallet.payment.completed
    protocol: RabbitMQ
    description: "WALLET publishes when payment for job posting or featured job is completed"
    queue: wallet.events
    payload:
      event_id: uuid
      wallet_id: bigint
      order_id: bigint
      order_type: "job_posting" | "featured_job" | "premium_subscription"
      amount: decimal
      related_module: string
      related_id: bigint
      timestamp: iso8601

  - from: WALLET
    to: LOG
    event: wallet.event.logged
    protocol: RabbitMQ
    description: "WALLET publishes wallet events (deposit, withdrawal, transfer, payment) to Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      wallet_id: bigint
      amount: decimal
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Auth Module Events (AUTH -> WALLET)
  # ============================================================

  - from: AUTH
    to: WALLET
    event: user.registered
    protocol: RabbitMQ
    description: "AUTH publishes when new user registers, WALLET creates wallet"
    queue: wallet.user
    payload:
      user_id: uuid
      email: string
      role: string
      timestamp: iso8601
