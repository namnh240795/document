# ============================================================
# Đăng ký Module - Frame tài liệu BA
# Định nghĩa tất cả module, cơ sở dữ liệu, bảng và phụ thuộc
# ============================================================

project:
  name: "Hệ thống Xác thực"
  short_name: "auth"

# ============================================================
# Module
# ============================================================
modules:
  - code: AUTH
    name: "Xác thực"
    description: "Quản lý tài khoản người dùng, đăng nhập, vai trò, phiên làm việc, xác minh. Chạy nội bộ các worker hàng đợi email/SMS — tiêu thụ từ RabbitMQ và gọi các module EMAIL/SMS để gửi"
    database: auth_db
    tables:
      - auth_users
      - auth_sessions
      - auth_accounts
      - auth_verification
      - auth_roles
      - auth_user_roles
      - auth_organizations
      - auth_members
      - auth_teams
      - auth_team_members
      - auth_invitations
      - auth_organization_roles
    depends_on:
      - SMS
      - EMAIL
      - LOG
    queue_workers:
      - name: "Email Queue Worker"
        queues: ["verification.email", "password.reset.email", "invitation.email"]
        description: "Tiêu thụ sự kiện email (xác minh, đặt lại mật khẩu, lời mời), gọi module EMAIL để gửi email"
      - name: "SMS Queue Worker"
        queues: ["password.reset.sms"]
        description: "Tiêu thụ sự kiện SMS đặt lại mật khẩu, gọi module SMS để gửi OTP"
    tech_stack:
      - NestJS
      - Better Auth
      - Drizzle ORM
      - PostgreSQL
      - RabbitMQ (amqplib)

  - code: SMS
    name: "Dịch vụ SMS"
    description: "Ghi nhật ký gửi SMS, theo dõi và lưu trữ lịch sử kiểm toán"
    database: sms_db
    tables:
      - sms_logs
    depends_on:
      - AUTH
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - Twilio

  - code: EMAIL
    name: "Thông báo Email"
    description: "Gửi thông báo email, quản lý mẫu và lưu trữ lịch sử kiểm toán. Cung cấp API gửi email (mẫu, SendGrid/SMTP) — được worker hàng đợi email của AUTH sử dụng"
    database: email_db
    tables:
      - email_logs
    depends_on: []
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - SendGrid/SMTP

  - code: RECR
    name: "Tuyển dụng"
    description: "Quản lý tuyển dụng toàn diện với 3 vai trò: Ứng viên, HR, Nhà tuyển dụng"
    database: recr_db
    tables:
      - recr_users
      - recr_candidates
      - recr_employers
      - recr_hr_profiles
      - recr_jobs
      - recr_applications
      - recr_interviews
      - recr_evaluations
      - recr_offers
      - recr_job_requirements
    depends_on:
      - AUTH
      - LOG
    color: "#E8F4E8"
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - Elasticsearch
      - RabbitMQ

  - code: WALLET
    name: "Ví điện tử"
    description: "Ví điện tử cho thanh toán, nạp tiền, rút tiền và các giao dịch tài chính trong nền tảng tuyển dụng"
    database: wallet_db
    tables:
      - wallet_wallets
      - wallet_transactions
      - wallet_payment_methods
      - wallet_payment_orders
      - wallet_payout_requests
    depends_on:
      - AUTH
      - LOG
    color: "#E8F4FD"
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - RabbitMQ

  - code: LOG
    name: "Ghi nhật ký"
    description: "Ghi nhật ký tập trung sự kiện — nhận sự kiện nhật ký từ tất cả dịch vụ qua RabbitMQ, lưu trữ trong OpenSearch để tìm kiếm toàn văn, phân tích và bảng điều khiển"
    database: opensearch
    index: log-events
    tables: []
    depends_on:
      - AUTH
    tech_stack:
      - NestJS
      - RabbitMQ (amqplib)
      - OpenSearch (@opensearch-project/opensearch)
    architecture:
      description: |
        Pipeline ghi nhật ký theo sự kiện (OpenSearch làm kho lưu trữ chính):
        Bất kỳ Dịch vụ nào → RabbitMQ (queue: log.events) → Logger Consumer → OpenSearch
      components:
        - name: Log Producer
          role: "Đăng phát sự kiện nhật ký lên hàng đợi RabbitMQ 'log.events'"
          implemented_in: "Mỗi dịch vụ (AUTH, SMS, v.v.)"
        - name: Log Consumer
          role: "Tiêu thụ từ RabbitMQ, lập chỉ mục vào OpenSearch"
          implemented_in: "Logger Worker"
        - name: OpenSearch
          role: "Kho lưu trữ chính — tìm kiếm toàn văn, phân tích, bảng điều khiển"
          index: "log-events"
        - name: Log Query API
          role: "API REST để truy vấn nhật ký từ OpenSearch"
      log_schema:
        eventId: "keyword — mã định danh sự kiện duy nhất (UUID)"
        source: "text + keyword — tên dịch vụ tạo sự kiện (auth, sms, v.v.)"
        level: "keyword — debug, info, warn, error"
        action: "keyword — hành động sự kiện (login, register, send_otp, v.v.)"
        message: "text — thông báo nhật ký dễ đọc"
        input: "text — dữ liệu đầu vào dưới dạng chuỗi JSON"
        output: "text — kết quả thành công dưới dạng chuỗi JSON"
        error: "text — thông báo lỗi khi thất bại"
        exception: "text — ngoại lệ kèm theo stack trace"
        metadata: "object — dữ liệu ngữ cảnh bổ sung"
        traceId: "keyword — mã truy vết phân tán"
        userId: "keyword — mã người dùng liên quan"
        timestamp: "date — thời gian sự kiện (ISO 8601)"

  - code: FILE
    name: "Quản lý tệp"
    description: "Tải lên, tải xuống, liệt kê, quản lý thư mục, phân quyền và quản lý vòng đời tệp với local filesystem. Hỗ trợ thao tác hàng loạt, sao chép/di chuyển tệp, kiểm soát truy cập và hạn ngạch lưu trữ"
    database: file_db
    tables:
      - sys_files
      - sys_file_permissions
      - sys_storage_usage
      - sys_storage_quotas
      - sys_storage_policies
    depends_on:
      - AUTH
      - LOG
    tech_stack:
      - NestJS
      - Drizzle ORM
      - PostgreSQL
      - Multer (local upload)
      - fs (local filesystem)

# ============================================================
# Tính năng — ánh xạ tính năng kinh doanh với module
# Cho thấy các module làm việc cùng nhau cho mỗi tính năng
# ============================================================
features:
  - name: "Đăng ký người dùng"
    modules: [AUTH, SMS, EMAIL, LOG]
    description: "Người dùng đăng ký, nhận OTP qua SMS/email, tài khoản được tạo, sự kiện được ghi nhật ký"

  - name: "Đăng nhập người dùng"
    modules: [AUTH, LOG]
    description: "Người dùng xác thực, phiên làm việc được tạo, sự kiện đăng nhập được ghi nhật ký"

  - name: "Xác minh số điện thoại"
    modules: [AUTH, SMS, LOG]
    description: "Người dùng yêu cầu SMS OTP, SMS được gửi, xác minh được xác nhận, sự kiện được ghi nhật ký"

  - name: "Xác minh email"
    modules: [AUTH, EMAIL, LOG]
    description: "Người dùng yêu cầu email OTP, email được gửi, xác minh được xác nhận, sự kiện được ghi nhật ký"

  - name: "Đặt lại mật khẩu"
    modules: [AUTH, EMAIL, LOG]
    description: "Người dùng yêu cầu đặt lại, email được gửi kèm token, mật khẩu được cập nhật, sự kiện được ghi nhật ký"

  - name: "Đăng tin tuyển dụng"
    modules: [RECR, LOG]
    description: "Quản lý HR tạo tin tuyển dụng, tin được đăng, sự kiện được ghi nhật ký"

  - name: "Nộp đơn ứng tuyển"
    modules: [RECR, EMAIL, LOG]
    description: "Ứng viên nộp đơn ứng tuyển, email xác nhận được gửi, sự kiện được ghi nhật ký"

  - name: "Lên lịch phỏng vấn"
    modules: [RECR, EMAIL, LOG]
    description: "Nhà tuyển dụng lên lịch phỏng vấn, lời mời lịch được gửi, sự kiện được ghi nhật ký"

  - name: "Quản lý lời mời"
    modules: [RECR, EMAIL, LOG]
    description: "Nhà tuyển dụng tạo lời mời, thư lời mời được gửi, sự kiện được ghi nhật ký"

  - name: "Nạp tiền vào ví"
    modules: [WALLET, LOG]
    description: "Người dùng nạp tiền qua chuyển khoản ngân hàng, thẻ tín dụng hoặc ví điện tử, giao dịch được ghi nhận"

  - name: "Rút tiền từ ví"
    modules: [WALLET, LOG]
    description: "Người dùng yêu cầu rút tiền, quản trị viên phê duyệt, tiền được chuyển vào ngân hàng"

  - name: "Chuyển tiền trong ví"
    modules: [WALLET, LOG]
    description: "Người dùng chuyển tiền sang ví của người dùng khác"

  - name: "Thanh toán đăng tin tuyển dụng"
    modules: [WALLET, RECR, LOG]
    description: "Nhà tuyển dụng thanh toán đăng tin bằng số dư ví, tin được kích hoạt"

  - name: "Thanh toán tin nổi bật"
    modules: [WALLET, RECR, LOG]
    description: "Nhà tuyển dụng thanh toán để hiển thị tin nổi bật, tin được đánh dấu nổi bật"

  - name: "Quản lý ví"
    modules: [WALLET, LOG]
    description: "Người dùng xem số dư, đặt mã PIN, quản lý phương thức thanh toán, xem lịch sử giao dịch"

# ============================================================
# Giao tiếp giữa các Module (Sự kiện Webhook)
# Các module giao tiếp qua sự kiện webhook
# ============================================================
webhooks:

  # ============================================================
  # Sự kiện Module Logger (tất cả dịch vụ -> LOG)
  # ============================================================

  - from: AUTH
    to: LOG
    event: auth.event.logged
    protocol: RabbitMQ
    description: "AUTH đăng phát bất kỳ sự kiện xác thực nào (đăng nhập, đăng xuất, đăng ký, đổi mật khẩu) đến Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      ip_address: string
      user_agent: string
      metadata: jsonb
      timestamp: iso8601

  - from: SMS
    to: LOG
    event: sms.event.logged
    protocol: RabbitMQ
    description: "SMS đăng phát sự kiện gửi (đã gửi, đã nhận, thất bại) đến Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      provider_message_id: string
      status: string
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Sự kiện Module Email (AUTH -> EMAIL)
  # ============================================================

  - from: AUTH
    to: EMAIL
    event: verification.email.requested
    protocol: RabbitMQ
    description: "AUTH đăng phát khi người dùng yêu cầu xác minh email"
    queue: verification.email
    payload:
      user_id: uuid
      email: string
      channel: "email"
      otp: string
      verification_id: string

  - from: AUTH
    to: EMAIL
    event: verification.email.resent
    protocol: RabbitMQ
    description: "AUTH đăng phát khi người dùng gửi lại email xác minh (giới hạn tốc độ)"
    queue: verification.email
    payload:
      user_id: uuid
      email: string
      channel: "email"
      otp: string
      verification_id: string

  - from: EMAIL
    to: AUTH
    event: verification.email.delivered
    protocol: Webhook
    description: "EMAIL xác nhận trạng thái gửi lại cho AUTH"
    url: /api/webhooks/email/delivered
    payload:
      verification_id: string
      status: "delivered" | "failed"
      provider_message_id: string
      error_message: string | null

  # ============================================================
  # Sự kiện đặt lại mật khẩu (AUTH -> EMAIL, SMS)
  # ============================================================

  - from: AUTH
    to: EMAIL
    event: password.reset.email.requested
    protocol: RabbitMQ
    description: "AUTH đăng phát khi người dùng yêu cầu đặt lại mật khẩu qua email"
    queue: password.reset.email
    payload:
      user_id: uuid
      email: string
      reset_token: string
      expires_at: iso8601
      verification_id: string

  - from: AUTH
    to: SMS
    event: password.reset.sms.requested
    protocol: RabbitMQ
    description: "AUTH đăng phát khi người dùng yêu cầu đặt lại mật khẩu qua SMS"
    queue: password.reset.sms
    payload:
      user_id: uuid
      phone: string
      otp: string
      expires_at: iso8601
      verification_id: string

  # ============================================================
  # Sự kiện lời mời (AUTH -> EMAIL)
  # ============================================================

  - from: AUTH
    to: EMAIL
    event: invitation.email.requested
    protocol: RabbitMQ
    description: "AUTH đăng phát khi quản trị viên mời thành viên vào tổ chức"
    queue: invitation.email
    payload:
      event_id: uuid
      inviter_email: string
      invitee_email: string
      organization_name: string
      invite_url: string
      role: string
      expires_at: iso8601
      invitation_id: string

  - from: AUTH
    to: EMAIL
    event: invitation.email.resent
    protocol: RabbitMQ
    description: "AUTH đăng phát khi quản trị viên gửi lại lời mời"
    queue: invitation.email
    payload:
      event_id: uuid
      inviter_email: string
      invitee_email: string
      organization_name: string
      invite_url: string
      role: string
      expires_at: iso8601
      invitation_id: string

  # ============================================================
  # Sự kiện Module Email (EMAIL -> LOG)
  # ============================================================

  - from: EMAIL
    to: LOG
    event: email.event.logged
    protocol: RabbitMQ
    description: "EMAIL đăng phát sự kiện gửi email (đã gửi, đã nhận, thất bại) đến Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      provider_message_id: string
      status: string
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Sự kiện Module Tuyển dụng (RECR -> EMAIL, LOG)
  # ============================================================

  - from: RECR
    to: EMAIL
    event: application.submitted
    protocol: RabbitMQ
    description: "RECR đăng phát khi ứng viên nộp đơn ứng tuyển"
    queue: recruitment.email
    payload:
      event_id: uuid
      candidate_email: string
      candidate_name: string
      job_title: string
      timestamp: iso8601

  - from: RECR
    to: EMAIL
    event: interview.scheduled
    protocol: RabbitMQ
    description: "RECR đăng phát khi phỏng vấn được lên lịch"
    queue: recruitment.email
    payload:
      event_id: uuid
      candidate_email: string
      candidate_name: string
      interviewer_email: string
      scheduled_at: iso8601
      location: string
      meeting_link: string
      timestamp: iso8601

  - from: RECR
    to: EMAIL
    event: offer.sent
    protocol: RabbitMQ
    description: "RECR đăng phát khi thư lời mời được gửi"
    queue: recruitment.email
    payload:
      event_id: uuid
      candidate_email: string
      candidate_name: string
      position_title: string
      salary: decimal
      start_date: date
      timestamp: iso8601

  - from: RECR
    to: LOG
    event: recruitment.event.logged
    protocol: RabbitMQ
    description: "RECR đăng phát sự kiện tuyển dụng (đơn ứng tuyển, phỏng vấn, lời mời) đến Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Sự kiện Module Ví (WALLET -> RECR, LOG)
  # ============================================================

  - from: WALLET
    to: RECR
    event: wallet.payment.completed
    protocol: RabbitMQ
    description: "WALLET đăng phát khi thanh toán cho đăng tin tuyển dụng hoặc tin nổi bật hoàn tất"
    queue: wallet.events
    payload:
      event_id: uuid
      wallet_id: bigint
      order_id: bigint
      order_type: "job_posting" | "featured_job" | "premium_subscription"
      amount: decimal
      related_module: string
      related_id: bigint
      timestamp: iso8601

  - from: WALLET
    to: LOG
    event: wallet.event.logged
    protocol: RabbitMQ
    description: "WALLET đăng phát sự kiện ví (nạp tiền, rút tiền, chuyển khoản, thanh toán) đến Logger"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      wallet_id: bigint
      amount: decimal
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Sự kiện Module Auth (AUTH -> WALLET)
  # ============================================================

  - from: AUTH
    to: WALLET
    event: user.registered
    protocol: RabbitMQ
    description: "AUTH đăng phát khi người dùng mới đăng ký, WALLET tạo ví"
    queue: wallet.user
    payload:
      user_id: uuid
      email: string
      role: string
      timestamp: iso8601

  # ============================================================
  # Sự kiện Module File (FILE -> LOG)
  # ============================================================

  - from: FILE
    to: LOG
    event: file.event.logged
    protocol: RabbitMQ
    description: "FILE đăng phát sự kiện truy cập tệp tin (xem, tải xuống, sửa, xóa) đến Logger để kiểm toán"
    queue: log.events
    payload:
      event_id: uuid
      level: "info" | "warn" | "error"
      action: string
      user_id: uuid | null
      file_id: uuid
      file_name: string
      ip_address: string
      metadata: jsonb
      timestamp: iso8601

  # ============================================================
  # Sự kiện Dọn dẹp File (FILE内部 — FileWorker tiêu thụ)
  # ============================================================

  - from: FILE
    to: FILE
    event: file.deleted
    protocol: RabbitMQ
    description: "FILE đăng phát khi tệp tin bị xóa mềm, FileWorker tiêu thụ để xóa vật lý trên S3"
    queue: file.events
    payload:
      file_id: uuid
      storage_key: string
      bucket_name: string
      user_id: uuid
      timestamp: iso8601

  - from: FILE
    to: FILE
    event: file.temp_cleanup
    protocol: RabbitMQ
    description: "FILE đăng phát khi tệp tin tạm hết hạn bị dọn dẹp, FileWorker tiêu thụ để xóa vật lý trên S3"
    queue: file.events
    payload:
      file_id: uuid
      storage_key: string
      bucket_name: string
      timestamp: iso8601
